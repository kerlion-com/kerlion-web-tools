name: Build JSON-LD Data Validator ZIP

on:
  push:
    branches: [main]

jobs:
  package-json-ld-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tool
        run: |
          mkdir -p dist
          cd tools
          zip -r ../dist/kerlion-json-ld-data-validator-v1.0.1.zip json-ld-data-validator
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kerlion-json-ld-data-validator-v1.0.1
          path: dist/kerlion-json-ld-data-validator-v1.0.1.zip
